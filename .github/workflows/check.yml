name: Code checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: cargo test --locked --manifest-path server/Cargo.toml
      - run: cargo clippy --locked --manifest-path server/Cargo.toml --lib -- -D warnings
