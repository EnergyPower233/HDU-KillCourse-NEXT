name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
          - platform: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - platform: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check version and tag
        id: version
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8').replace(/^\uFEFF/, ''));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8').replace(/^\uFEFF/, ''));
          const toml = fs.readFileSync('server/Cargo.toml', 'utf8');
          const version = /^version\s*=\s*"([^"]+)"/m.exec(toml)?.[1];
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(pkg.version)) throw Error('Invalid version');
          if (version !== pkg.version || lock.version !== pkg.version) throw Error('Versions must match in package.json, package-lock.json and server/Cargo.toml');
          if (process.env.GITHUB_REF_TYPE === 'tag' && process.env.GITHUB_REF_NAME !== `v${version}`) throw Error('Tag must match the package version');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE
      - name: Install frontend dependencies
        run: npm ci
      - name: Test and build frontend
        run: |
          npm test
          npm run build
          test -s dist/index.html
      - name: Test Rust
        run: cargo test --locked --manifest-path server/Cargo.toml --target '${{ matrix.target }}'
      - name: Build embedded release binary
        run: cargo build --release --locked --manifest-path server/Cargo.toml --target '${{ matrix.target }}'
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: |
          $name = "hdu-killcourse-next-v$env:VERSION-$env:PLATFORM"
          $package = Join-Path 'staging' $name
          New-Item -ItemType Directory -Path $package, 'artifacts' -Force | Out-Null
          Copy-Item -LiteralPath "server/target/$env:TARGET/release/hdu-course-server.exe" -Destination $package
          Copy-Item -LiteralPath README.md,LICENSE -Destination $package
          Copy-Item -LiteralPath docs,examples -Destination $package -Recurse
          Copy-Item -LiteralPath CONTRIBUTING.md -Destination $package
          Compress-Archive -LiteralPath $package -DestinationPath "artifacts/$name.zip"
      - name: Package macOS and Linux
        if: runner.os != 'Windows'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: |
          name="hdu-killcourse-next-v${VERSION}-${PLATFORM}"
          mkdir -p "staging/$name" artifacts
          cp "server/target/$TARGET/release/hdu-course-server" "staging/$name/"
          chmod +x "staging/$name/hdu-course-server"
          cp README.md LICENSE CONTRIBUTING.md "staging/$name/"
          cp -R docs examples "staging/$name/"
          tar -czf "artifacts/$name.tar.gz" -C staging "$name"
      - uses: actions/upload-artifact@v6
        with:
          name: package-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create release draft
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: package-*
          path: artifacts
          merge-multiple: true
      - name: Verify assets and create draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(artifacts/*.zip artifacts/*.tar.gz)
          if [ "${#packages[@]}" -ne 6 ]; then
            echo 'Expected all six platform archives.' >&2
            exit 1
          fi
          (cd artifacts && sha256sum *.zip *.tar.gz > SHA256SUMS.txt)
          if gh release view "$TAG" --json isDraft >/tmp/release-state.json 2>/dev/null; then
            if [ "$(jq -r '.isDraft' /tmp/release-state.json)" != true ]; then
              echo 'Release is already published; refusing to replace its assets.' >&2
              exit 1
            fi
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* \
              --verify-tag --draft --prerelease \
              --title "HDU-KillCourse NEXT $TAG" \
              --notes '自动构建的预览版本。请下载对应系统与架构的压缩包；使用说明见包内 README.md。构建与自动测试不代表真实教务选退课已经验证。'
          fi
