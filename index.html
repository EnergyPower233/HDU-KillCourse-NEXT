    <script>
      try {
        var t = localStorage.getItem('hdu-theme') || 'system';
        var d =
          t === 'system'
            ? matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : t;
        document.documentElement.dataset.theme = d;
      } catch (e) {}
    </script>
